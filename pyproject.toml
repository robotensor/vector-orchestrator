[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robotensor-vector-engine"
version = "0.3.0"
description = "Duel engine for Robotensor Vector: units, scoring and the result store."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=1.0"]

[project.urls]
Repository = "https://github.com/robotensor/vector-orchestrator"

[project.scripts]
vector-orchestrator = "vector_orchestrator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_orchestrator"]

# The contract travels with the wheel, so an installed orchestrator reads the one it was built with.
[tool.hatch.build.targets.wheel.force-include]
"spec.json" = "vector_orchestrator/data/spec.json"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "packages/vector-protocol/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vector-protocol/tests"]
# Two test trees share module names such as test_package.py.
addopts = "--import-mode=importlib"
# importlib mode puts no test directory on sys.path; the orchestrator's tests import their
# conftest and store_helpers as plain modules, and the vector-protocol tests share helpers from a
# module of their own. The orchestrator's directory comes first, so `conftest` is its own.
pythonpath = ["tests", "packages/vector-protocol/tests"]
markers = [
  "sim: needs the RoboTwin-Vector checkout's simulator (assets, GPU)",
  "slow: takes minutes",
  "network: asks the real Hugging Face Hub; skipped when it cannot be reached",
]
